name: Integração contínua

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: lexis_ci_root
          MYSQL_DATABASE: lexis_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root --password=lexis_ci_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      FRONTEND_URL: http://localhost:5173
      DATABASE_URL: mysql://root:lexis_ci_root@127.0.0.1:3306/lexis_test
      SHADOW_DATABASE_URL: mysql://root:lexis_ci_root@127.0.0.1:3306/lexis_shadow
      TEST_DATABASE_URL: mysql://root:lexis_ci_root@127.0.0.1:3306/lexis_test
      JWT_ACCESS_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      JWT_REFRESH_SECRET: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      BCRYPT_ROUNDS: 10
      OCR_SPACE_API_KEY: lexis_ci_test_key
      EMAIL_ENABLED: false

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Configurar o Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Gerar o Prisma Client
        run: npx prisma generate

      - name: Aplicar migrations no banco de teste
        run: npx prisma migrate deploy

      - name: Executar lint
        run: npm run lint

      - name: Executar testes
        run: npm test

  frontend:
    name: Frontend — lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Configurar o Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Executar lint
        run: npm run lint

      - name: Executar testes
        run: npm test

      - name: Gerar build de produção
        run: npm run build

  e2e:
    name: E2E — fluxos no navegador
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: lexis_ci_root
          MYSQL_DATABASE: lexis_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root --password=lexis_ci_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      # e2e/runtime.js exige MySQL em loopback e banco lexis_test; as demais variáveis
      # de ambiente são montadas por ele, com provedores externos desligados.
      TEST_DATABASE_URL: mysql://root:lexis_ci_root@127.0.0.1:3306/lexis_test

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Configurar o Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Instalar dependências do backend
        run: npm ci
        working-directory: backend

      - name: Instalar dependências do frontend
        run: npm ci
        working-directory: frontend

      - name: Instalar dependências do E2E
        run: npm ci
        working-directory: e2e

      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Preparar o banco de teste
        run: npm run db:prepare
        working-directory: e2e

      - name: Executar lint
        run: npm run lint
        working-directory: e2e

      - name: Conferir as guardas do banco de teste
        run: npm run test:guards
        working-directory: e2e

      - name: Executar os fluxos no navegador
        run: npm test
        working-directory: e2e
